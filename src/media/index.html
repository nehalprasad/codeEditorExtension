<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Chat with File</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs/loader.min.js"></script>
  <script>
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      // Monaco is now ready
      window.monacoReady = true;
      if (window.onMonacoReady) {
        window.onMonacoReady();
      }
    });
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div id="chatContainer">
    <div id="messages"></div>

    <form id="chatForm">
      <div id="filePreviewContainer" style="display: none;">
        <div id="fileHeader">
          <span id="fileName"></span>
          <button type="button" id="removeFile" title="Remove file">✕</button>
        </div>
        <button id="applyChanges" class="apply-btn" style="display: none;" title="Apply changes to file">
          Apply Changes
        </button>

        <div id="fileContent"></div>
        <button id="uploadSelection" class="upload-btn" type="button" style="display: none; margin-top: 12px;" title="Upload selected code to chat input">
          ⬆️ Upload Selection
        </button>
      </div>

      <div id="inputContainer">
        <textarea id="input" rows="3" placeholder="Ask me anything about your code..."></textarea>
        <button type="button" id="attachFile" title="Attach file from workspace">📎</button>
        <button type="submit" id="send" disabled>Ask</button>
      </div>

      <input type="file" id="fileInput" style="display: none;" />
    </form>
  </div>

  <script src="./main.js"></script>
</body>

</html>
